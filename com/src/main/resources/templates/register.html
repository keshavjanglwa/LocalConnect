<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-card">
    <h1>Create Account</h1>

    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" th:field="*{name}" required>
            <div class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" required>
            <div class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}" required>
            <div class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
        </div>
        <div class="form-group">
            <label for="locality">Locality (e.g. Sector 36, Delhi)</label>
            <input type="text" id="locality" th:field="*{locality}" required>
            <div class="error-text" th:if="${#fields.hasErrors('locality')}" th:errors="*{locality}"></div>
        </div>
        <button type="submit" class="btn" style="width:100%;">Register</button>
    </form>

    <p style="text-align:center; margin-top:16px;">
        Already have an account? <a th:href="@{/login}">Log in</a>
    </p>
</div>
</body>
</html>
