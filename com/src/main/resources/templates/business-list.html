<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New in Area - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"> 
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="page-header">
        <h1>New in Your Area</h1>
        <a th:href="@{/business/new}" class="btn">+ Add Business</a>
    </div>

    <form class="filters" th:action="@{/business}" method="get">
        <select name="category" onchange="this.form.submit()" style="padding:8px; border:1px solid #e0e0dc; border-radius:6px;">
            <option value="">All Categories</option>
            <option th:each="c : ${T(java.util.List).of('Shop','Restaurant','Gym','Cafe','Coaching','Service','Salon')}"
                    th:value="${c}" th:text="${c}" th:selected="${c == category}"></option>
        </select>
    </form>

    <div th:if="${#lists.isEmpty(posts)}" class="empty-state">
        No new businesses posted in your locality yet.
    </div>

    <div class="card" th:each="biz : ${posts}">
        <div style="display:flex; justify-content:space-between; align-items:start;">
            <h3 th:text="${biz.businessName}">Business Name</h3>
            <span class="badge" th:text="${biz.category}">Category</span>
        </div>
        <div class="meta">
            <span th:text="${biz.locality}">Locality</span>
            <span th:if="${biz.address}"> · <span th:text="${biz.address}">Address</span></span>
            <span th:if="${biz.openingDate}"> · Opened: <span th:text="${biz.openingDate}">date</span></span>
        </div>
        <p th:if="${biz.description}" th:text="${biz.description}">Description</p>
        <p th:if="${biz.contact}">📞 <span th:text="${biz.contact}">contact</span></p>

        <div th:if="${biz.user.id == currentUser.id}">
            <form class="inline-form confirm-delete" th:action="@{'/business/' + ${biz.id} + '/delete'}" method="post">
                <button type="submit" class="btn btn-small btn-danger">Delete</button>
            </form>
        </div>

</div>
</body>
</html>
