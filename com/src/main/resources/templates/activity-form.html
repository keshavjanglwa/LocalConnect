<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Activity Post - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container"> 
    <h1>New Activity Partner Post</h1>

    <form th:action="@{/activities}" th:object="${activityPost}" method="post">
        <div class="form-group">
            <label for="activityName">Activity Name</label>
            <input type="text" id="activityName" th:field="*{activityName}"
                   placeholder="e.g. Pickleball, Cricket, Study, Gaming" required>
            <div class="error-text" th:if="${#fields.hasErrors('activityName')}" th:errors="*{activityName}"></div>
        </div>
        <div class="form-group">
            <label for="activityTime">Date &amp; Time</label>
            <input type="datetime-local" id="activityTime" th:field="*{activityTime}" required>
            <div class="error-text" th:if="${#fields.hasErrors('activityTime')}" th:errors="*{activityTime}"></div>
        </div>
        <div class="form-group">
            <label for="partnerCount">Number of Partners Needed</label>
            <input type="number" id="partnerCount" th:field="*{partnerCount}" min="1" value="1" required>
            <div class="error-text" th:if="${#fields.hasErrors('partnerCount')}" th:errors="*{partnerCount}"></div>
        </div>
        <div class="form-group">
            <label for="location">Location (optional)</label>
            <input type="text" id="location" th:field="*{location}" placeholder="e.g. Sector 36 Park">
        </div>
        <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" th:field="*{message}" placeholder="Add any details..."></textarea>
        </div>
        <button type="submit" class="btn">Post Activity</button>
        <a th:href="@{/activities}" class="btn btn-secondary">Cancel</a>
    </form> 
</div>
</body>
</html>
