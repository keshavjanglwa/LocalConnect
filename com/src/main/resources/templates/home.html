<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Home - Locality Connect</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>
 
<div class="container">
    <div class="page-header">
        <h1>Hi, <span th:text="${currentUser.name}">User</span> 👋</h1>
        <a th:href="@{/activities/new}" class="btn">+ New Activity Post</a>
    </div>
    <p style="color:#6b6b6b; margin-top:-10px;">
        Showing recent activity posts near <strong th:text="${currentUser.locality}">your locality</strong>
    </p>

    <div th:if="${#lists.isEmpty(feed)}" class="empty-state">
        No activity posts in your locality yet. Be the first to post!
    </div>

    <div class="card" th:each="post : ${feed}">
        <div style="display:flex; justify-content:space-between; align-items:start;">
            <h3><a th:href="@{'/activities/' + ${post.id}}" th:text="${post.activityName}">Activity</a></h3>
            <span class="badge" th:classappend="'status-' + ${post.status}" th:text="${post.status}">OPEN</span>
        </div>
        <div class="meta">
            By <span th:text="${post.user.name}">Someone</span> ·
            <span th:text="${#temporals.format(post.activityTime, 'dd MMM, hh:mm a')}">time</span> ·
            Looking for <span th:text="${post.partnerCount}">1</span> partner(s)
            <span th:if="${post.location}"> · 📍 <span th:text="${post.location}">location</span></span>
        </div>
        <p th:text="${post.message}">Message text</p>
        <a th:href="@{'/activities/' + ${post.id}}" class="btn btn-small btn-secondary">View &amp; Reply</a>
    </div>
</div>
</body>
</html>
